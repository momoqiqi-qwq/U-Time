[package]
name = "letime"
version = "0.283.2"
description = "Le时间管理 · 时间块与四象限"
authors = ["梁逸乐 (Yile Liang / momoni / lele / liangyile)"]
edition = "2021"

[lib]
name = "letime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：桌面端系统托盘（feature 本身被 tauri 用 cfg(desktop) 门控，Android 构建不受影响）
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "gzip", "cookies"] }
encoding_rs = "0.8"
des = "0.8"
ecb = "0.1"
hex = "0.4"
base64 = "0.22"
ring = "0.17.14"
tiny_http = "0.12"
qrcode = { version = "0.14", features = ["svg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target."cfg(any(target_os = \"windows\", target_os = \"linux\", target_os = \"macos\"))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[target."cfg(target_os = \"windows\")".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# 界面演示图（capture_ui_shot）：走 WebView2 的 ICoreWebView2::CapturePreview 截当前画面。
# 这两个 crate 本来就在依赖树里（tauri → wry → webview2-com），这里只是提升为直接依赖，
# 不新增编译单元；windows 的 feature 按「内存流 IStream + HGLOBAL」最小集添加。
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }
webview2-com = "0.38"

# 教务导入窗口的 Android 关闭通道：JniHandle::exec 回调里调 Activity.finish()
# （版本与 tauri 锁定的 jni 0.21 统一，避免双版本共存的类型不一致）
[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21"

[profile.release]
# v0.58.1：lto 由 true 改 "thin"（链接期 2~5 倍提速、恢复多核并行），
# 移除 codegen-units = 1（原为单线程优化，是构建慢的最大单项）。
# 代价：二进制略大、运行时性能略降，对此类桌面工具无感。
lto = "thin"
strip = true
