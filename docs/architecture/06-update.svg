 y="333" width="66" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="697" y="348" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 状态机</text><text x="52" y="348" font-size="15" font-weight="700" fill="#0f172a">check → download :307 → ready :311 → install :360</text><text x="52" y="368" font-size="13.5" font-weight="400" fill="#334155">进度走 Tauri 事件 update:progress（updateChecker.js:389）</text><line x1="390" y1="378" x2="390" y2="407" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="408" width="700" height="74" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><rect x="40" y="408" width="6" height="74" rx="3" fill="#dc2626"/><rect x="676" y="417" width="54" height="21" rx="10.5" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-opacity=".5"/><text x="703" y="432" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">⑦ 下载</text><text x="52" y="432" font-size="15" font-weight="700" fill="#0f172a">update_download :401：validate_release_url :207 强制 github + https</text><text x="52" y="452" font-size="13.5" font-weight="400" fill="#334155">流式写 app_cache_dir 的 .part，下完 rename :473</text><text x="52" y="472" font-size="13.5" font-weight="400" fill="#b91c1c">下完校验大小与 GitHub 给的 SHA-256 摘要；不校验独立签名（模块头部写明）</text><line x1="390" y1="482" x2="390" y2="511" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="512" width="700" height="94" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><rect x="40" y="512" width="6" height="94" rx="3" fill="#dc2626"/><rect x="676" y="521" width="54" height="21" rx="10.5" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-opacity=".5"/><text x="703" y="536" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">⑦ 安装</text><text x="52" y="536" font-size="15" font-weight="700" fill="#0f172a">Windows :491 起 NSIS 安装器 /S /R 分离进程，然后 app.exit(0) :530</text><text x="52" y="556" fon